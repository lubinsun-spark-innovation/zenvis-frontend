name: Deploy Zenvis frontend to Cloudflare

on:
  push:
    branches:
      - feature/frontend-ui-revision-20260810
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - ".env.production"
      - "index.html"
      - "package.json"
      - "public/**"
      - "src/**"
      - "vite.config.ts"
      - "worker.mjs"
      - "wrangler.toml"
      - "yarn.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenvis-cloudflare-production
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      FRONTEND_DOMAIN: soc.lubinsun.2333123.xyz
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test frontend
        run: yarn test

      - name: Build production frontend
        run: yarn build:pro-tsc

      - name: Deploy Worker and static assets
        run: yarn wrangler deploy

      - name: Public frontend and API smoke test
        run: |
          set -Eeuo pipefail
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "https://$FRONTEND_DOMAIN/" -o "$body_file" \
              && grep -q '<title>zenvis</title>' "$body_file"; then
              asset_path=$(grep -oE 'src="[^"]+\.js"' "$body_file" | head -n 1 | cut -d'"' -f2)
              if [[ -n "$asset_path" ]] \
                && curl -fsS "https://$FRONTEND_DOMAIN$asset_path" -o /dev/null \
                && curl -fsS "https://$FRONTEND_DOMAIN/zenvis/actuator/health/readiness" -o /dev/null; then
                exit 0
              fi
            fi
            echo "Waiting for Cloudflare deployment (${attempt}/30)..."
            sleep 4
          done
          echo "::error::Cloudflare frontend or proxied API smoke test failed." >&2
          exit 1
